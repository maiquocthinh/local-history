[workspace]
members = [
    "crates/history",
    "crates/daemon",
    "crates/cli",
    "crates/gui",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
zstd = "0.13"
similar = "2"
blake3 = "1"
time = "0.3"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tempfile = "3"
notify = "7"
fd-lock = "4"
# glow: renderer OpenGL — ổn định hơn wgpu/DX12 trên máy ảo/driver GPU hạn chế
# (wgpu khởi tạo DX12 có thể ACCESS_VIOLATION lúc start)
eframe = { version = "0.37", features = ["glow"] }
rfd = "0.18"
clap = { version = "4", features = ["derive"] }
rust-i18n = "3"
sys-locale = "0.3"
