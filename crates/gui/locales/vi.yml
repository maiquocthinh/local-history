# Chuỗi tiếng Việt cho GUI `lh-gui`.
# Format: mỗi file chứa đúng 1 cây YAML; locale là tên file (vi.yml → "vi").
# Map lồng được flatten thành key có dấu chấm (panel.workspace, diff.mode_prev, ...).
# Quy tắc: tập key ở đây phải trùng khớp en.yml — kiểm bởi test
# `i18n_yml_key_parity_and_cover_t_calls` trong crates/gui/src/main.rs.
# `%{name}` = placeholder. Value là chuỗi double-quoted nằm trọn 1 dòng.
# Badge kind (external/save/...) là giá trị kỹ thuật — giữ nguyên, không dịch.
