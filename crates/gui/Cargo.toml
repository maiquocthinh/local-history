[package]
name = "gui"
version.workspace = true
edition.workspace = true
description = "local-history desktop viewer (egui)"

[[bin]]
name = "lh-gui"
path = "src/main.rs"

[dependencies]
history = { path = "../history" }
eframe = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
time = { workspace = true }
rust-i18n = { workspace = true }
sys-locale = { workspace = true }
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
# Functional UI tests (headless): the base harness needs NO renderer — only the
# optional snapshot/image features pull in wgpu, which this machine avoids.
# The "eframe" feature enables Harness::build_eframe (drives a real eframe App).
egui_kittest = { version = "0.37", default-features = false, features = ["eframe"] }
