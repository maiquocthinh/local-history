[package]
name = "cli"
version.workspace = true
edition.workspace = true
description = "local-history multi-call CLI (`lh`): storage commands + gui + daemon passthrough + self-update"

[[bin]]
name = "lh"
path = "src/main.rs"

[dependencies]
history = { path = "../history" }
daemon = { path = "../daemon" }
gui = { path = "../gui" }
updater = { path = "../updater" }
clap = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
rust-i18n = { workspace = true }
sys-locale = { workspace = true }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = { workspace = true }
